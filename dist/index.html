<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>QPI Ambient</title>
    <link rel="manifest" href="./assets/manifest-Cv_wvAjJ.json">
    <link rel="icon" href="./assets/logo-CY6R7WdG.ico">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="./assets/apple-icon-9bdQC00L.png">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="./assets/index-Bgt50mtw.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-6v22xdc0.css">
</head>

<body>
    <div class="layer sky-base"></div>
    <div id="skyLayer" class="layer sky-layer"></div>
    <div class="layer atmosphere"></div>
    <!-- JWST Starmap 컨테이너 (달 위치에 구멍을 뚫기 위해 wrapper 레이어 도입) -->
    <div class="layer star-wrapper">
        <div class="layer star-container"></div>
        <div id="satLayer" class="layer" style="z-index: 3;"></div>
    </div>
    <div class="layer celestial">
        <div class="moon-aura"></div>
        <div class="moon-disk">
            <!-- 1. 달의 가려진 부분의 반사광 (지구조/Earthshine 실루엣) -->
            <div class="moon-earthshine"></div>
            <!-- 2. 오직 빛을 받는 실제 천문학적 위상 부분 -->
            <div class="moon-crescent">
                <svg width="32" height="32" viewBox="0 0 32 32" style="width: 100%; height: 100%; display: block;">
                    <path id="moonCrescentPath" d="" fill="#fff6e3" />
                </svg>
            </div>
        </div>
        <div class="sun-disk"></div>
    </div>

    <div class="lens-flare-container" id="sunFlareCont">
        <div class="sun-streak"></div>
        <div class="flare-ghost flare-halo" id="h-1" style="width: 60vmax; height: 60vmax;"></div>
        <div class="flare-ghost ghost-rainbow" id="r-1" style="width: 500px; height: 500px;"></div>
        <div class="flare-ghost ghost-hex" id="g-1" style="width: 100px; height: 100px;"></div>
        <div class="flare-ghost ghost-hex" id="g-2"
            style="width: 50px; height: 50px; background: rgba(150, 255, 200, 0.12);"></div>
        <div class="flare-ghost ghost-tiny" id="t-1"
            style="width: 10px; height: 10px; background: #fff; box-shadow: 0 0 10px #fff;"></div>
    </div>

    <div class="moon-flare-container" id="moonFlareCont">
        <div class="flare-ghost ghost-hex" id="mg-1"
            style="width: 40px; height: 40px; background: rgba(200, 230, 255, 0.1);"></div>
        <div class="flare-ghost flare-halo" id="mh-1" style="width: 20vmax; height: 20vmax; opacity: 0.2;"></div>
    </div>

    <div class="film-grain"></div>
    <canvas id="vizCanvas" class="viz-canvas"></canvas>

    <div class="info-panel glass-panel-base" id="infoPanel">
        <div class="row"><span><b>DATE</b> <span id="infoDate">-</span></span></div>
        <div class="row" style="font-size: 10px;"><span><b>RISE</b> <span id="infoRise">-</span></span><span><b>SET</b>
                <span id="infoSet">-</span></span></div>
        <hr style="border: 0; border-top: 1px solid var(--glass-border); margin-bottom: 20px;">
        <div class="row"><span class="label">Auto Sync</span><label class="switch"><input type="checkbox" id="autoCheck"
                    checked><span class="slider-sw"></span></label></div>
        <div class="row"><span class="label">Performance Mode</span><label class="switch"><input type="checkbox" id="perfCheck"><span class="slider-sw"></span></label></div>
        <div id="manualSection" class="manual-ui disabled">
            <div class="row" style="flex-direction:column; align-items:flex-start; gap:6px;">
                <span class="label">Simulated Date</span>
                <input type="date" id="datePicker" style="display: none;">
                <div id="datePickerContainer" style="
                    display: flex;
                    align-items: center;
                    gap: 4px;
                    width: 100%;
                    box-sizing: border-box;
                ">
                    <input type="number" id="dateYY" min="1970" max="2100" style="
                        width: 38%;
                        padding: 8px 6px;
                        border-radius: 8px;
                        border: 1px solid var(--glass-border);
                        background: var(--glass-bg);
                        color: var(--text-main);
                        font-family: inherit;
                        font-size: 13px;
                        outline: none;
                        text-align: center;
                        box-sizing: border-box;
                    ">
                    <span style="color: var(--text-sub); font-size: 12px;">년</span>
                    <input type="number" id="dateMM" min="1" max="12" style="
                        width: 25%;
                        padding: 8px 6px;
                        border-radius: 8px;
                        border: 1px solid var(--glass-border);
                        background: var(--glass-bg);
                        color: var(--text-main);
                        font-family: inherit;
                        font-size: 13px;
                        outline: none;
                        text-align: center;
                        box-sizing: border-box;
                    ">
                    <span style="color: var(--text-sub); font-size: 12px;">월</span>
                    <input type="number" id="dateDD" min="1" max="31" style="
                        width: 25%;
                        padding: 8px 6px;
                        border-radius: 8px;
                        border: 1px solid var(--glass-border);
                        background: var(--glass-bg);
                        color: var(--text-main);
                        font-family: inherit;
                        font-size: 13px;
                        outline: none;
                        text-align: center;
                        box-sizing: border-box;
                    ">
                    <span style="color: var(--text-sub); font-size: 12px;">일</span>
                </div>
            </div>
            <div class="row" style="flex-direction:column; align-items:flex-start; gap:4px;"><span class="label">Time
                    Slider</span><input type="range" id="timeRange" min="0" max="1439.99" step="0.01" value="720"></div>
            <div class="row"><span class="label">Speed (<span id="speedVal">1</span>x)</span>
                <div class="speed-chips"><button class="chip" onclick="adjustSpeed(0.5)">x0.5</button><button
                        class="chip" onclick="adjustSpeed(2)">x2</button><button class="chip"
                        onclick="adjustSpeed(-1)">x-1</button></div>
            </div>
        </div>
    </div>

    <div class="bottom-clock" id="clock"><span id="clockT">00:00:00</span><span
            style="position: absolute; inset: 0;"></span></div>

</body>

</html>
